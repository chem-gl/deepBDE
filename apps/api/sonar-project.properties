# sonar-project.properties — backend Django de DeepBDE.
# Escanea solo codigo propio; el submodulo deepbde/** y artefactos quedan fuera.
# Ejecucion: scripts/sonar_scan.sh api (el coverage se pasa condicionalmente desde el script).

sonar.projectKey=deepbde-api
sonar.projectName=deepBDE API
sonar.sourceEncoding=UTF-8
sonar.host.url=${env.SONAR_HOST_URL}
sonar.token=${env.SONAR_TOKEN}

sonar.sources=api,predictor
sonar.tests=api
sonar.test.inclusions=**/tests.py,**/test_*.py
sonar.python.version=3.12

# Sin rutas de coverage hardcodeadas: se inyectan con -D... solo si existen los reportes.

sonar.exclusions=deepbde/**,**/migrations/**,.venv/**,**/__pycache__/**,manage.py,predictor/asgi.py,predictor/wsgi.py,static/**,staticfiles/**,**/conftest.py,**/*.sqlite3,**/public/**
sonar.coverage.exclusions=deepbde/**,**/migrations/**,manage.py,predictor/asgi.py,predictor/wsgi.py,predictor/settings.py,**/conftest.py,**/tests.py,static/**,**/public/**
sonar.cpd.exclusions=**/migrations/**,**/tests.py
