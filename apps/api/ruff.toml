# ruff.toml — lint/format del backend propio. Submodulo y artefactos fuera.
line-length = 100

exclude = [
    "deepbde",
    ".venv",
    "**/migrations",
    "__pycache__",
    "*.ipynb",
]

[lint]
# Reglas por defecto (E,F). Relax para codigo Django generado si hace falta.
# NOTA: api/controllers/* y api/model/dto.py tienen deuda F401 preexistente
# en edicion por otro agente; resolverla antes de esperar CI verde.
# E501: el baseline no cumple line-length 100; aplicar progresivamente.
select = ["E", "F"]
ignore = ["E501"]
