# sonar-project.properties — frontend Angular de DeepBDE.
# packages/client NO se escanea aqui (queda fuera de este projectBaseDir).
# Ejecucion: scripts/sonar_scan.sh web (el coverage lcov se pasa condicionalmente desde el script).

sonar.projectKey=deepbde-web
sonar.projectName=deepBDE Web
sonar.sourceEncoding=UTF-8
sonar.host.url=${env.SONAR_HOST_URL}
sonar.token=${env.SONAR_TOKEN}

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Sin rutas de coverage hardcodeadas: se inyectan con -D... solo si existen los reportes.

sonar.exclusions=node_modules/**,dist/**,.angular/**,src/assets/**,coverage/**,**/*.d.ts,public/ketcher/**,src/environments/environment.prod.ts
sonar.coverage.exclusions=src/main.ts,src/app/app.config.ts,src/app/app.routes.ts,src/environments/**,src/test-setup.ts,**/*.spec.ts,**/*.html
sonar.cpd.exclusions=**/*.spec.ts
