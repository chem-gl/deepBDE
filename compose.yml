# compose.yml unico del monorepo deepBDE.
# Uso: docker compose up --build
# (apps/api/compose.yml queda deprecated en favor de este archivo)
services:
  backend:
    build: ./apps/api
    container_name: deepbde-backend
    ports:
      # 8001: chemistry-apps ocupa 8000 en el host; deepBDE usa 8001.
      - "8001:8000"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - redis

  redis:
    image: redis:7.2-alpine
    container_name: deepbde-redis
    # Sin puertos publicados: 6379 del host lo ocupa el redis del sistema.
    # El backend llega por red interna (redis:6379).
    ports: !reset []
    volumes:
      - redis_data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: deepbde-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  redis_data:
